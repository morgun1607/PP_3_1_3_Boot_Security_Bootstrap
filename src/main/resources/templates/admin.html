<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin panel</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
</head><body class="bg-light"><nav class="navbar navbar-dark bg-dark px-3"><span class="navbar-brand mb-0"><strong th:text="${currentUser.email}"></strong> with roles: <span th:text="${currentUser.roleNames}"></span></span>
<form th:action="@{/logout}" method="post" class="m-0"><button class="btn btn-link text-white-50 p-0" type="submit">Logout</button></form></nav><div class="container-fluid"><div class="row"><aside class="col-md-2 bg-white px-0 pt-3" style="min-height:calc(100vh - 56px)"><nav class="nav nav-pills flex-column"><a  class="nav-link active" th:href="@{/admin}">Admin</a><a class="nav-link " th:href="@{/user}">User</a></nav></aside><main class="col-md-10 px-4 pt-3"><h1 class="mb-3">Admin panel</h1><ul class="nav nav-tabs"><li class="nav-item"><a class="nav-link active" data-toggle="tab" href="#users-table">Users table</a></li><li class="nav-item"><a class="nav-link" data-toggle="tab" href="#new-user">New User</a></li></ul><div class="tab-content"><div class="tab-pane fade show active" id="users-table"><div class="card"><h5 class="card-header">All users</h5><div class="card-body table-responsive"><table class="table table-striped"><thead><tr><th>ID</th><th>First Name</th><th>Last Name</th><th>Age</th><th>Email</th><th>Role</th><th>Edit</th><th>Delete</th></tr></thead><tbody><tr th:each="u : ${users}"><td th:text="${u.id}"></td><td th:text="${u.name}"></td><td th:text="${u.lastName}"></td><td th:text="${u.age}"></td><td th:text="${u.email}"></td><td th:text="${u.roleNames}"></td><td><button class="btn btn-info btn-sm" data-toggle="modal" th:data-target="'#edit-'+${u.id}">Edit</button></td><td><button class="btn btn-danger btn-sm" data-toggle="modal" th:data-target="'#delete-'+${u.id}">Delete</button></td></tr></tbody></table></div></div><th:block th:each="u : ${users}"><div class="modal fade" th:id="'edit-'+${u.id}" tabindex="-1" role="dialog"><div class="modal-dialog" role="document"><div class="modal-content"><form method="post" th:action="@{/admin/{id}/update(id=${u.id})}"><div class="modal-header"><h5 class="modal-title">Edit user</h5><button type="button" class="close" data-dismiss="modal" aria-label="Close">&times;</button></div><div class="modal-body"><div class="mx-auto" style="max-width:205px"><div class="form-group text-center"><label class="font-weight-bold mb-0">ID</label><input class="form-control form-control-sm" type="number" readonly th:value="${u.id}" ></div>
<div class="form-group text-center"><label class="font-weight-bold mb-0">First name</label><input class="form-control form-control-sm" type="text" name="name" required th:value="${u.name}" ></div>
<div class="form-group text-center"><label class="font-weight-bold mb-0">Last name</label><input class="form-control form-control-sm" type="text" name="lastName" required th:value="${u.lastName}" ></div>
<div class="form-group text-center"><label class="font-weight-bold mb-0">Age</label><input class="form-control form-control-sm" type="number" name="age" required th:value="${u.age}" min="0" max="150"></div>
<div class="form-group text-center"><label class="font-weight-bold mb-0">Email</label><input class="form-control form-control-sm" type="email" name="email" required th:value="${u.email}" ></div>
<div class="form-group text-center"><label class="font-weight-bold mb-0">Password</label><input class="form-control form-control-sm" type="password" name="password"   ></div><div class="form-group text-center"><label class="font-weight-bold mb-0">Role</label><select class="form-control form-control-sm" name="roleIds" multiple size="2" required><option th:each="role : ${roles}" th:value="${role.id}" th:text="${#strings.replace(role.name,'ROLE_','')}" th:selected="${u.roles.contains(role)}"></option></select></div></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button><button type="submit" class="btn btn-primary">Edit</button></div></form></div></div></div><div class="modal fade" th:id="'delete-'+${u.id}" tabindex="-1" role="dialog"><div class="modal-dialog" role="document"><div class="modal-content"><form method="post" th:action="@{/admin/{id}/delete(id=${u.id})}"><div class="modal-header"><h5 class="modal-title">Delete user</h5><button type="button" class="close" data-dismiss="modal" aria-label="Close">&times;</button></div><div class="modal-body"><div class="mx-auto" style="max-width:205px"><div class="form-group text-center"><label class="font-weight-bold mb-0">ID</label><input class="form-control form-control-sm" type="number" readonly th:value="${u.id}" ></div>
<div class="form-group text-center"><label class="font-weight-bold mb-0">First name</label><input class="form-control form-control-sm" type="text" readonly th:value="${u.name}" ></div>
<div class="form-group text-center"><label class="font-weight-bold mb-0">Last name</label><input class="form-control form-control-sm" type="text" readonly th:value="${u.lastName}" ></div>
<div class="form-group text-center"><label class="font-weight-bold mb-0">Age</label><input class="form-control form-control-sm" type="number" readonly th:value="${u.age}" min="0" max="150"></div>
<div class="form-group text-center"><label class="font-weight-bold mb-0">Email</label><input class="form-control form-control-sm" type="email" readonly th:value="${u.email}" ></div><div class="form-group text-center"><label class="font-weight-bold mb-0">Role</label><select class="form-control form-control-sm" name="roleIds" multiple size="2" disabled><option th:each="role : ${roles}" th:value="${role.id}" th:text="${#strings.replace(role.name,'ROLE_','')}" th:selected="${u.roles.contains(role)}"></option></select></div></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button><button type="submit" class="btn btn-danger">Delete</button></div></form></div></div></div></th:block></div><div class="tab-pane fade" id="new-user"><div class="card"><h5 class="card-header">Add new user</h5><div class="card-body"><form class="mx-auto text-center" style="max-width:310px" method="post" th:action="@{/admin/create}"><div class="form-group text-center"><label class="font-weight-bold mb-0">First name</label><input class="form-control form-control-sm" type="text" name="name" required  ></div>
<div class="form-group text-center"><label class="font-weight-bold mb-0">Last name</label><input class="form-control form-control-sm" type="text" name="lastName" required  ></div>
<div class="form-group text-center"><label class="font-weight-bold mb-0">Age</label><input class="form-control form-control-sm" type="number" name="age" required  min="0" max="150"></div>
<div class="form-group text-center"><label class="font-weight-bold mb-0">Email</label><input class="form-control form-control-sm" type="email" name="email" required  ></div>
<div class="form-group text-center"><label class="font-weight-bold mb-0">Password</label><input class="form-control form-control-sm" type="password" name="password" required  ></div><div class="form-group text-center"><label class="font-weight-bold mb-0">Role</label><select class="form-control form-control-sm" name="roleIds" multiple size="2" required><option th:each="role : ${roles}" th:value="${role.id}" th:text="${#strings.replace(role.name,'ROLE_','')}" ></option></select></div><button class="btn btn-success btn-lg" type="submit">Add new user</button></form></div></div></div></div></main></div></div><script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.bundle.min.js"></script><script>$(function(){var hash=location.hash;if(hash==='#new-user') $('a[href="#new-user"]').tab('show');if(/^#edit-\d+$/.test(hash)) $(hash).modal('show');});</script></body></html>
