<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>User page</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
</head><body class="bg-light"><nav class="navbar navbar-dark bg-dark px-3"><span class="navbar-brand mb-0"><strong th:text="${user.email}"></strong> with roles: <span th:text="${user.roleNames}"></span></span>
<form th:action="@{/logout}" method="post" class="m-0"><button class="btn btn-link text-white-50 p-0" type="submit">Logout</button></form></nav><div class="container-fluid"><div class="row"><aside class="col-md-2 bg-white px-0 pt-3" style="min-height:calc(100vh - 56px)"><nav class="nav nav-pills flex-column"><a th:if="${#strings.contains(user.roleNames,'ADMIN')}" class="nav-link" th:href="@{/admin}">Admin</a><a class="nav-link active" th:href="@{/user}">User</a></nav></aside><main class="col-md-10 px-4 pt-3"><h1 class="mb-3">User information-page</h1><div class="card"><h5 class="card-header">About user</h5><div class="card-body table-responsive"><table class="table table-striped"><thead><tr><th>ID</th><th>First Name</th><th>Last Name</th><th>Age</th><th>Email</th><th>Role</th></tr></thead><tbody><tr><td th:text="${user.id}"></td><td th:text="${user.name}"></td><td th:text="${user.lastName}"></td><td th:text="${user.age}"></td><td th:text="${user.email}"></td><td th:text="${user.roleNames}"></td></tr></tbody></table></div></div></main></div></div></body></html>
